services:
  neo4j:
    image: neo4j:5.20
    container_name: vckg-neo4j
    ports:
      - "7474:7474"   # browser UI
      - "7687:7687"   # bolt
    environment:
      NEO4J_AUTH: neo4j/password123
      NEO4J_server_memory_heap_max__size: 2G
    volumes:
      - neo4j_data:/data

  mongo:
    image: mongo:7
    container_name: vckg-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  ollama:
    image: ollama/ollama:latest
    container_name: vckg-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Uncomment for NVIDIA GPU
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  neo4j_data:
  mongo_data:
  ollama_data:
